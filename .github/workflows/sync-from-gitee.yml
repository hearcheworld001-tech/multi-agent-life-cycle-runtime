name: Sync from Gitee

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-from-gitee
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Gitee repository
        env:
          GITEE_REPOSITORY: https://gitee.com/he-lizi_admin/multi-agent-life-cycle-runtime.git
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -n "$GITEE_USERNAME" ] && [ -n "$GITEE_TOKEN" ]; then
            GITEE_AUTH_REPOSITORY="https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/he-lizi_admin/multi-agent-life-cycle-runtime.git"
          else
            GITEE_AUTH_REPOSITORY="$GITEE_REPOSITORY"
          fi
          git clone --bare "$GITEE_AUTH_REPOSITORY" repository.git

      - name: Push branches and tags to GitHub
        working-directory: repository.git
        env:
          GITHUB_REPOSITORY_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git remote add github "$GITHUB_REPOSITORY_URL"
          git push --force github 'refs/heads/*:refs/heads/*'
          git push --force github 'refs/tags/*:refs/tags/*'
